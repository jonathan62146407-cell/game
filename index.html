<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>注音拼字大挑戰</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --dark: #2F2E41;
            --light: #F7FFF7;
            --accent: #FFD93D;
        }
        body { 
            font-family: -apple-system, "Noto Sans TC", sans-serif; 
            background-color: #f8f9fa; margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
        }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: var(--dark); font-size: 1.8rem; margin: 20px 0; }
        
        /* 模式選擇選單 */
        #menu-screen { display: flex; flex-direction: column; gap: 20px; width: 100%; margin-top: 50px; }
        .menu-btn {
            padding: 30px; font-size: 1.5rem; font-weight: bold; border: none; border-radius: 20px;
            cursor: pointer; color: white; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .host-btn { background-color: var(--primary); }
        .player-btn { background-color: var(--secondary); }
        .menu-btn:active { transform: scale(0.95); }

        /* 遊戲畫面 */
        .game-screen { display: none; width: 100%; flex-direction: column; align-items: center; }
        .card { 
            background: white; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); 
            padding: 25px; width: 100%; box-sizing: border-box; margin-bottom: 20px; text-align: center;
        }
        .topic-text { font-size: 1.5rem; color: var(--dark); font-weight: bold; line-height: 1.4; margin: 15px 0; }
        
        /* 計時器樣式 */
        .timer-container { margin: 20px 0; padding: 15px; background: #fff5f5; border-radius: 15px; border: 2px dashed var(--primary); }
        .timer-display { font-size: 3rem; font-weight: bold; color: var(--primary); font-family: monospace; }
        .timer-controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .timer-input { width: 60px; padding: 5px; font-size: 1.2rem; text-align: center; border: 1px solid #ddd; border-radius: 5px; }
        .small-btn { padding: 8px 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .btn-start { background: var(--secondary); color: white; }
        .btn-reset { background: #cbd5e0; color: var(--dark); }

        /* 注音池 */
        .symbol-pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 20px 0; }
        .symbol { 
            background: #edf2f7; color: var(--dark); width: 45px; height: 45px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px; font-size: 1.4rem; font-weight: bold; border-bottom: 4px solid #cbd5e0;
        }

        .action-btn {
            background: var(--dark); color: white; border: none; padding: 15px 30px;
            border-radius: 50px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%;
            margin-top: 10px;
        }
        .back-btn { background: none; color: #888; border: none; margin-top: 20px; text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🧩 注音拼字王</h1>

        <div id="menu-screen">
            <button class="menu-btn host-btn" onclick="showScreen('host')">👑 我是關主</button>
            <button class="menu-btn player-btn" onclick="showScreen('player')">✏️ 我是答題者</button>
        </div>

        <div id="host-screen" class="game-screen">
            <div class="card">
                <div style="color: var(--primary); font-weight: bold;">📢 關主請出題</div>
                <div id="topic-display" class="topic-text">準備好了嗎？</div>
                <button class="action-btn" onclick="generateTopic()" style="background: var(--primary);">🎲 隨機換個題目</button>
                
                <div class="timer-container">
                    <div style="font-size: 0.9rem; color: #888; margin-bottom: 5px;">倒數計時 (秒)</div>
                    <div id="timer" class="timer-display">30</div>
                    <div class="timer-controls">
                        <input type="number" id="timer-input" class="timer-input" value="30" min="1">
                        <button id="timer-btn" class="small-btn btn-start" onclick="toggleTimer()">開始</button>
                        <button class="small-btn btn-reset" onclick="resetTimer()">重設</button>
                    </div>
                </div>
            </div>
            <button class="back-btn" onclick="showScreen('menu')">返回首頁</button>
        </div>

        <div id="player-screen" class="game-screen">
            <div class="card">
                <div style="color: var(--secondary); font-weight: bold;">🎴 你的手牌 (可重複使用)</div>
                <div id="symbol-display" class="symbol-pool"></div>
                <button class="action-btn" onclick="generateHand()" style="background: var(--secondary);">🔄 重新抽牌</button>
            </div>
            <button class="back-btn" onclick="showScreen('menu')">返回首頁</button>
        </div>
    </div>

    <script>
        const topics = [
            "剛生完小孩，現在最想吃什麼？",
            "在電梯遇到老闆，心裡在想什麼？",
            "如果中了頭獎，第一件想買的東西？",
            "忙了一整天，回家最想做的一件事？",
            "另一半做了什麼會讓你秒消氣？",
            "形容你的老闆，但不能用髒話。",
            "衣櫃裡永遠缺一件什麼？",
            "如果可以變身，你想變成什麼？",
            "這輩子吃過最奇怪的東西是什麼？",
            "如果你有一億元，你會先捐給誰？"
        ];

        const symbols = ["ㄅ", "ㄆ", "ㄇ", "ㄈ", "ㄉ", "ㄊ", "ㄋ", "ㄌ", "ㄍ", "ㄎ", "ㄏ", "ㄐ", "ㄑ", "ㄒ", "ㄓ", "ㄔ", "ㄕ", "ㄖ", "ㄗ", "ㄘ", "ㄙ", "ㄧ", "ㄨ", "ㄩ"];

        let countdown;
        let timeLeft;
        let isRunning = false;

        function showScreen(screen) {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('host-screen').style.display = 'none';
            document.getElementById('player-screen').style.display = 'none';
            resetTimer();

            if (screen === 'menu') {
                document.getElementById('menu-screen').style.display = 'flex';
            } else {
                document.getElementById(screen + '-screen').style.display = 'flex';
                if (screen === 'host') generateTopic();
                if (screen === 'player') generateHand();
            }
        }

        // --- 關主邏輯 ---
        function generateTopic() {
            const randomTopic = topics[Math.floor(Math.random() * topics.length)];
            document.getElementById('topic-display').innerText = randomTopic;
            resetTimer();
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(countdown);
                document.getElementById('timer-btn').innerText = "開始";
                document.getElementById('timer-btn').style.background = "var(--secondary)";
            } else {
                if (!timeLeft) timeLeft = document.getElementById('timer-input').value;
                document.getElementById('timer-btn').innerText = "停止";
                document.getElementById('timer-btn').style.background = "#e67e22";
                
                countdown = setInterval(() => {
                    timeLeft--;
                    document.getElementById('timer').innerText = timeLeft;
                    if (timeLeft <= 0) {
                        clearInterval(countdown);
                        alert("時間到！⏰");
                        resetTimer();
                    }
                }, 1000);
            }
            isRunning = !isRunning;
        }

        function resetTimer() {
            clearInterval(countdown);
            isRunning = false;
            timeLeft = document.getElementById('timer-input').value;
            document.getElementById('timer').innerText = timeLeft;
            document.getElementById('timer-btn').innerText = "開始";
            document.getElementById('timer-btn').style.background = "var(--secondary)";
        }

        // --- 答題者邏輯 ---
        function generateHand() {
            const display = document.getElementById('symbol-display');
            display.innerHTML = "";
            for (let i = 0; i < 10; i++) {
                const s = symbols[Math.floor(Math.random() * symbols.length)];
                display.innerHTML += `<div class="symbol">${s}</div>`;
            }
        }
    </script>
</body>
</html>
